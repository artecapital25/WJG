<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Logo WJGEEKS - Variantes Vectoriales SVG</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #38bdf8;
      text-align: center;
    }
    p {
      color: #94a3b8;
      margin-bottom: 30px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card.light-bg {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }
    .card.light-bg h3 {
      color: #0f172a;
    }
    .card.light-bg .badge {
      background: #e2e8f0;
      color: #334155;
    }
    .card h3 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 16px;
      text-align: center;
    }
    .img-box {
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .badge {
      margin-top: 15px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Kit de Marca Vectorial: WJGEEKS</h1>
  <p>Generado a partir de la nueva imagen master de 2048x2048 (WJG.jpeg)</p>

  <div class="grid">
    <!-- Original JPEG -->
    <div class="card">
      <h3>Referencia Master</h3>
      <div class="img-box">
        <img src="WJG.jpeg" alt="Original Master">
      </div>
      <span class="badge">JPG 2048x2048</span>
    </div>

    <!-- SVG Badge -->
    <div class="card">
      <h3>Vector Badge Oficial</h3>
      <div class="img-box">
        <img src="wjg_logo_vector.svg" alt="Badge SVG">
      </div>
      <span class="badge">SVG Circular con Sombra</span>
    </div>

    <!-- SVG Transparent on light -->
    <div class="card light-bg">
      <h3>Fondo Transparente (Documentos/PDF)</h3>
      <div class="img-box">
        <img src="wjg_logo_transparent.svg" alt="Transparent SVG">
      </div>
      <span class="badge">SVG Transparente Claro</span>
    </div>

    <!-- SVG Dark Mode -->
    <div class="card">
      <h3>Modo Oscuro / App Móvil</h3>
      <div class="img-box">
        <img src="wjg_logo_darkmode.svg" alt="Dark Mode SVG">
      </div>
      <span class="badge">SVG Neón Cyber Tech</span>
    </div>
  </div>
</body>
</html>

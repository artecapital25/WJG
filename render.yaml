services:
  - type: web
    name: wjgeeks-whatsapp-gateway
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node scripts/whatsapp_gateway_server.cjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3001
      - key: WA_SESSION_ID
        value: wjgeeks-main
      - key: RENDER_EXTERNAL_URL
        value: https://wjg.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
